[tool.poetry]
name = "big-pig-farm"
version = "0.1.0"
description = "A terminal-based idle simulation game where players manage a guinea pig farm"
authors = ["Big Pig Farm Team"]
readme = "README.md"
packages = [{include = "big_pig_farm"}, {include = "tools"}]

[tool.poetry.dependencies]
python = "^3.10"
textual = "^0.47.0"
rich = "^13.0.0"
pydantic = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^1.0.0"
ruff = "^0.4.0"
mypy = "^1.10.0"

[tool.poetry.scripts]
big-pig-farm = "big_pig_farm.main:main"
sprite-editor = "tools.sprite_editor:main"
sprite-preview = "tools.preview_sprite:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Textual app teardown in tests — _stop_engine coroutine gets GC'd before awaiting
    "ignore:coroutine 'BigPigFarmApp._stop_engine' was never awaited:RuntimeWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]  # Line length handled by formatter

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
