[tool.poetry]
name = "big-pig-farm"
version = "0.1.0"
description = "A terminal-based idle simulation game where players manage a guinea pig farm"
authors = ["Big Pig Farm Team"]
readme = "README.md"
packages = [{include = "big_pig_farm"}]

[tool.poetry.dependencies]
python = "^3.10"
textual = "^0.47.0"
rich = "^13.0.0"
pydantic = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"

[tool.poetry.scripts]
big-pig-farm = "big_pig_farm.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
